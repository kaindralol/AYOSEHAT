name: ayosehat
description: "AYOSEHAT — Rencana Olahraga Kamu. Jadwal olahraga mahasiswa yang ikut pindah saat agenda kuliah berubah."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  youtube_player_iframe: ^5.2.1
  url_launcher: ^6.2.5
  file_picker: ">=10.3.10 <11.0.0"
  excel: ^4.0.6
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Ikon aplikasi di HP (dibuat otomatis saat build)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
