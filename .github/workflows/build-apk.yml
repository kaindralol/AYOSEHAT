name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cari folder proyek
        run: |
          if [ -f pubspec.yaml ]; then echo "APP_DIR=." >> $GITHUB_ENV;
          elif [ -f ayosehat/pubspec.yaml ]; then echo "APP_DIR=ayosehat" >> $GITHUB_ENV;
          else echo "pubspec.yaml tidak ditemukan" && exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan folder Android
        run: |
          cd "$APP_DIR"
          flutter create --project-name ayosehat --org id.ayosehat --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="ayosehat"/android:label="AYOSEHAT"/' $M
          grep -q 'android.permission.INTERNET' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          G=android/build.gradle.kts; [ -f $G ] || G=android/build.gradle
          echo 'subprojects { tasks.configureEach { if (name.contains("lintVital")) enabled = false } }' >> $G
          cat >> android/app/proguard-rules.pro <<'PRO'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          PRO

      - name: Siapkan kunci rilis (tanda tangan tetap)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd "$APP_DIR"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat >> android/app/build.gradle.kts <<'KTS'
          android {
              signingConfigs {
                  create("ayosehat") {
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                      storeType = "pkcs12"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("ayosehat")
                  }
              }
          }
          KTS
            echo "Memakai kunci tetap AYOSEHAT"
          else
            echo "Secrets belum diisi, memakai kunci debug sementara"
          fi

      - name: Ambil dependency
        run: cd "$APP_DIR" && flutter pub get

      - name: Pasang ikon aplikasi
        run: cd "$APP_DIR" && dart run flutter_launcher_icons

      - name: Tes logika inti
        continue-on-error: true
        run: cd "$APP_DIR" && flutter test

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd "$APP_DIR" && flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: AYOSEHAT-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
